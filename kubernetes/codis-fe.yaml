apiVersion: v1
kind: ReplicationController
metadata:
  name: codis-fe
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: codis-fe
    spec:
      imagePullSecrets:
      - name: your-registry
      containers:
      - name: codis-fe
        image: codis-image
        imagePullPolicy: IfNotPresent
        command: ["codis-fe"]
        args: ["-l","log/$(POD_NAME).log","--etcd-config=/etc/codis/etcd/etcd.toml","--listen=$(POD_IP):8080","--assets-dir=$(CODIS_PATH)/bin/assets"]
        env:
        - name: CODIS_PATH
          value: "/gopath/src/github.com/CodisLabs/codis"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
          name: fe
        volumeMounts:
        - name: codis-etcd-config
          mountPath: /etc/codis/etcd
          readOnly: true
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "0.1"
            memory: 0.1Gi
      volumes:
      - name: codis-etcd-config
        configMap:
          name: codis-etcd
