# etcd 3.7 is the only supported Codis coordinator.
#
# The manifest below runs a SINGLE member, which is enough only for a demo or
# a test cluster: one failed pod means no quorum, and the Codis dashboard
# cannot write metadata or hold its product lock until etcd is back. A
# production deployment needs three members, each with its own PVC and
# anti-affinity, for example:
#   replicas: 3
#   --name=etcd-<ordinal>
#   --initial-cluster=etcd-0=http://etcd-0.etcd:2380,etcd-1=http://etcd-1.etcd:2380,etcd-2=http://etcd-2.etcd:2380
# and the matching advertise URLs. All members share --initial-cluster-token
# and --initial-cluster-state=new; the client URLs stay http://etcd:2379.
apiVersion: apps/v1beta1
kind: StatefulSet
metadata:
  name: etcd
spec:
  serviceName: etcd
  replicas: 1
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.7.4
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/etcd"]
        args:
        - "--name=etcd-0"
        - "--data-dir=/var/lib/etcd"
        - "--listen-client-urls=http://0.0.0.0:2379"
        - "--advertise-client-urls=http://etcd-0.etcd:2379"
        - "--listen-peer-urls=http://0.0.0.0:2380"
        - "--initial-advertise-peer-urls=http://etcd-0.etcd:2380"
        - "--initial-cluster=etcd-0=http://etcd-0.etcd:2380"
        - "--initial-cluster-token=codis-etcd"
        - "--initial-cluster-state=new"
        ports:
        - containerPort: 2379
          name: client
        - containerPort: 2380
          name: server
        readinessProbe:
          exec:
            command: ["/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
          initialDelaySeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
          initialDelaySeconds: 15
          timeoutSeconds: 5
        volumeMounts:
        - name: datadir
          mountPath: /var/lib/etcd
        resources:
          limits:
            cpu: "1"
            memory: 4Gi
          requests:
            cpu: "0.1"
            memory: 0.1Gi
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
