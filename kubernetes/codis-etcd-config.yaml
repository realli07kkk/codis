apiVersion: v1
kind: ConfigMap
metadata:
  name: codis-etcd
  labels:
    app: codis-etcd
data:
  etcd.toml: |
    # Codis coordinator connection file, shared by codis-dashboard, codis-fe,
    # codis-admin and codis-proxy through --etcd-config=FILE.
    #
    # Address priority: --etcd, the endpoints below, the dashboard
    # coordinator_addr, then http://127.0.0.1:2379. Relative paths resolve
    # against this file's directory.
    endpoints = ["http://etcd:2379"]
    dial_timeout = "5s"
    request_timeout = "5s"

    # Credentials: leave both empty (etcd without auth) or set both. Never
    # write a real password into this manifest; use an operator-owned Secret
    # or a mounted file instead.
    username = ""
    password = ""

    # Production HTTPS/mTLS variant (three members, per-role client
    # certificates; never commit real key material):
    # endpoints = ["https://etcd-a:2379", "https://etcd-b:2379", "https://etcd-c:2379"]
    # ca_file = "tls/ca.pem"
    # cert_file = "tls/client.pem"
    # key_file = "tls/client-key.pem"
