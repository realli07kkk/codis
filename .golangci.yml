version: "2"

# Keep the first pass narrow: correctness analyzers only. Style linters are
# intentionally left out so the target stays actionable on the existing tree.
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      # Keep correctness/deprecation checks; leave style-only S/ST/QF rules out.
      checks: ["SA*"]
  exclusions:
    rules:
      # etcd is deliberately frozen for this modernization round.
      - path: "(^|/)pkg/models/etcd/"
        linters:
          - govet
          - staticcheck
